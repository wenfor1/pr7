<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CyberSound Catalog — інтерактивна медіатека з моделюванням станів екрана та дизайн-системою.">
  <title>CyberSound Studio — QA & Audit (ПР №7)</title>
  <link rel="stylesheet" href="tokens.css">
  <script src="script.js" defer></script>
  <script src="tests.js" defer></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      padding: var(--space-6);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    header, main {
      background-color: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--card-radius);
      padding: var(--card-padding);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
    }

    .state-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    button {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--btn-radius);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    button.active-tab, button.btn-primary {
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      border-color: var(--btn-primary-bg);
    }

    button.btn-danger {
      background-color: transparent;
      color: #ff6b6b;
      border-color: #ff6b6b;
      padding: 4px 10px;
      font-size: 0.85rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--border-subtle);
    }

    .search-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 240px;
    }

    .search-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .search-group input {
      padding: var(--space-2) var(--space-3);
      border-radius: var(--btn-radius);
      border: 1px solid var(--input-border);
      background-color: var(--input-bg);
      color: var(--text-primary);
      font-size: 1rem;
    }

    .is-hidden { display: none !important; }

    /* Захист від переповнення контейнера при введенні 250+ символів без пробілів */
    .safe-wrap {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* Стан 1: Skeleton Loading */
    .skeleton-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .skeleton-card {
      height: 64px;
      border-radius: var(--btn-radius);
      background: linear-gradient(90deg, var(--bg-elevated) 25%, #2a3954 50%, var(--bg-elevated) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Стан 2: Content */
    .tracks-grid {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .track-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-4);
      background-color: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: var(--btn-radius);
    }

    .track-meta {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Стани 3 та 4: Empty та Error */
    .status-box {
      text-align: center;
      padding: var(--space-8) var(--space-4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
    }

    .status-box p {
      color: var(--text-muted);
      max-width: 480px;
    }

    .error-badge {
      color: #ff6b6b;
      font-family: monospace;
      font-weight: 700;
      background: rgba(239, 68, 68, 0.15);
      padding: 4px 10px;
      border-radius: 6px;
    }

    @media (max-width: 480px) {
      body { padding: var(--space-3); }
      header, main { padding: var(--space-4); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>🎵 CyberSound Catalog</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Тестування та аудит якості веб-додатку (ПР №7)</p>
      </div>

      <div class="state-switcher" role="group" aria-label="Перемикач станів екрана">
        <button type="button" class="switcher-btn active-tab" data-target="content">Дані</button>
        <button type="button" class="switcher-btn" data-target="loading">Завантаження</button>
        <button type="button" class="switcher-btn" data-target="empty">Порожній</button>
        <button type="button" class="switcher-btn" data-target="error">Помилка</button>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <div class="search-group">
          <label for="searchInput">Пошук у медіатеці (підтримує XSS-захист та граничні значення):</label>
          <input type="text" id="searchInput" placeholder="Введіть назву треку або жанр...">
        </div>
        <button type="button" id="refreshBtn" class="btn-primary">🔄 Оновити дані</button>
      </div>

      <!-- СТАН 1: LOADING -->
      <div class="state-view is-hidden" data-state="loading">
        <div class="skeleton-list">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>

      <!-- СТАН 2: CONTENT -->
      <div class="state-view" data-state="content">
        <div class="tracks-grid" id="tracksContainer"></div>
      </div>

      <!-- СТАН 3: EMPTY -->
      <div class="state-view is-hidden" data-state="empty">
        <div class="status-box">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" role="img" aria-label="Іконка відсутності результатів" style="color: var(--color-accent);">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
          <h2>Треків не знайдено</h2>
          <p class="safe-wrap">За запитом <strong id="emptyQueryDisplay"></strong> нічого не знайдено або список порожній.</p>
          <button type="button" id="resetBtn" class="btn-primary">Відновити початковий список</button>
        </div>
      </div>

      <!-- СТАН 4: ERROR -->
      <div class="state-view is-hidden" data-state="error">
        <div class="status-box">
          <span class="error-badge">ERROR 503: CONNECTION_TIMEOUT</span>
          <h2>Не вдалося завантажити каталог треків</h2>
          <p>Стався тимчасовий збій під час отримання даних із сервера медіатеки.</p>
          <button type="button" id="retryBtn" class="btn-primary">Повторити спробу</button>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
